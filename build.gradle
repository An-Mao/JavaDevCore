plugins {
    //id 'org.springframework.boot' version '3.3.0' // 适当的版本
    //id 'io.spring.dependency-management' version '1.1.7' // 适当的版本
    id 'java'
    id 'maven-publish'
    id 'application'
}
group = 'dev.anye'
version = '25.05.1901'
archivesBaseName = 'core'
sourceCompatibility = '21' // 适当的 Java 版本
repositories {
    mavenCentral()
}
dependencies {
    //implementation('org.springframework.boot:spring-boot-starter-web')
    implementation("net.java.dev.jna:jna-platform:5.15.0")
    implementation("com.google.code.gson:gson:2.13.1")
    implementation("org.graalvm.polyglot:polyglot:24.2.1")
    implementation("org.graalvm.polyglot:js:24.2.1")
    //implementation("org.graalvm.compiler:compiler:24.2.1")
}
//./gradlew clean build publishToMavenLocal
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            groupId = group
            artifactId = archivesBaseName
            version = version
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
/*
tasks.withType(JavaExec).configureEach {
    jvmArgs '-XX:+UnlockExperimentalVMOptions', '-XX:+EnableJVMCI',
            '--upgrade-module-path', configurations.runtimeClasspath.asPath
}

 */
application {
    mainClass = 'dev.anye.core.Main'
}