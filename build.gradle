//./gradlew clean build publishToMavenLocal
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            groupId = group
            artifactId = archivesBaseName
            version = version
            from components.java
        }
    }
    repositories {
        mavenLocal()
