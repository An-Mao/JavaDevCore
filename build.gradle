//import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    //id 'org.springframework.boot' version '3.3.0'
    //id 'io.spring.dependency-management' version '1.1.7'
    //id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
    id 'maven-publish'
    id 'application'
}
//
//def baseName = "core"
//def mainC = "dev.anye.core.Core"
//sourceCompatibility = '21' // 适当的 Java 版本

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}


repositories {
    mavenCentral()
}
configurations {
    shadow
    implementation.extendsFrom shadow
}
dependencies {
    //implementation('org.springframework.boot:spring-boot-starter-web')

    compileOnly 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'ch.qos.logback:logback-classic:1.5.13'

    compileOnly "org.openjdk.nashorn:nashorn-core:15.4"
    compileOnly "net.java.dev.jna:jna-platform:5.15.0"
    compileOnly "com.google.code.gson:gson:2.13.1"
    compileOnly "org.graalvm.polyglot:polyglot:24.2.1"
    compileOnly "org.graalvm.polyglot:js:24.2.1"


    //implementation("org.graalvm.compiler:compiler:24.2.1")

    //shadow("org.graalvm.polyglot:polyglot:24.2.1")
    //shadow("org.graalvm.polyglot:js:24.2.1")
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            group : project.group,
            version : project.version,
            baseName : project.baseName,
            archivesBaseName : project.baseName
    ]
    inputs.properties replaceProperties
}


